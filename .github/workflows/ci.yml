name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build
        run: ./scripts/build-app.sh
      - name: Verify app bundle
        run: ./scripts/verify-release.sh
